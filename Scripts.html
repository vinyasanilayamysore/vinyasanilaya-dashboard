<script>
  window.onload = loadDashboard;

  // Global scope memory variables to act as the single source of truth locally
  window.dashboardCache = null;

/**
 * Loads data either from memory cache or by calling the backend server script
 */
function loadDashboard(forcedRefresh = false) {
  const yearEl = document.getElementById('filterYear');
  const selectedYear = yearEl && yearEl.value ? yearEl.value : new Date().getFullYear().toString();

  // Context check: If data is already cached locally and this is a standard filter switch, use it!
  if (window.dashboardCache && !forcedRefresh) {
      console.log(">>> [PERFORMANCE] Serving view from local memory allocation cache.");
      processAndFilterData(window.dashboardCache);
      return;
  }

  // Otherwise, toggle loading animation state and make the server call
  if (typeof toggleRefreshLoadingState === 'function') {
      toggleRefreshLoadingState(true);
  }
  console.log(">>> [NETWORK] Pulling fresh data stream from server ledger...");

  google.script.run
      .withSuccessHandler(function(response) {
          if (typeof toggleRefreshLoadingState === 'function') {
              toggleRefreshLoadingState(false);
          }

          // Clear any stale availability results when fresh server data lands
          if (typeof resetFloorAvailabilityFilters === 'function') {
              resetFloorAvailabilityFilters();
          }
          
          // Commit payload directly into memory
          window.dashboardCache = response;

          if (response && response.guests && typeof rebuildMonthDropdown === 'function') {
              rebuildMonthDropdown(response.guests);
          }
          
          // Route payload into the visual layout processors
          processAndFilterData(response);
      })
      .withFailureHandler(function(err) {
          if (typeof toggleRefreshLoadingState === 'function') {
              toggleRefreshLoadingState(false);
          }
          console.error(">>> [CRITICAL] Ledger network grab failed: ", err.message || err);
          
          const feedEl = document.getElementById('guest-feed');
          if (feedEl) {
              feedEl.innerHTML = `<div class="alert alert-danger mx-3">Failed to load real-time database data: ${err.message || err}</div>`;
          }
      })
      .getDashboardData(selectedYear);
}

/**
 * User action script bound directly to the refresh icon button
 */
function refreshDashboardData() {
    console.log(">>> [ACTION] Refresh triggered. Evicting cache...");

    // 1. Reset floor availability UI selections & badges
    if (typeof resetFloorAvailabilityFilters === 'function') {
        resetFloorAvailabilityFilters();
    }

    // 2. Reset search input and hide clear button
    const searchEl = document.getElementById('filterSearchQuery');
    if (searchEl) {
        searchEl.value = '';
    }
    const clearBtn = document.getElementById('btnClearSearch');
    if (clearBtn) {
        clearBtn.classList.add('d-none');
    }

    // 3. Reset dropdown filters to default ("All")
    const sourceEl = document.getElementById('filterSource');
    if (sourceEl) sourceEl.value = 'All';

    const floorEl = document.getElementById('filterFloor');
    if (floorEl) floorEl.value = 'All';

    const monthEl = document.getElementById('filterMonth');
    if (monthEl) monthEl.value = 'All';

    // 4. Force a fresh pull from server
    loadDashboard(true);
}

/**
 * Resets all dashboard filter controls to default and re-filters cached data instantly
 */
function resetDashboardFilters() {
  // 1. Reset Month dropdown safely to index 0 ("All Months") or 'All'
  const filterMonth = document.getElementById('filterMonth');
  if (filterMonth) {
    // Try setting value first; if it doesn't exist, fall back to index 0
    filterMonth.value = 'All';
    if (filterMonth.selectedIndex === -1 && filterMonth.options.length > 0) {
      filterMonth.selectedIndex = 0;
    }
  }

  // 2. Reset Source and Floor dropdowns back to "All"
  const filterSource = document.getElementById('filterSource');
  const filterFloor = document.getElementById('filterFloor');

  if (filterSource) filterSource.value = 'All';
  if (filterFloor) filterFloor.value = 'All';

  // 3. Clear search input and hide the inline clear button ('X')
  const searchQuery = document.getElementById('filterSearchQuery');
  const btnClearSearch = document.getElementById('btnClearSearch');

  if (searchQuery) searchQuery.value = '';
  if (btnClearSearch) btnClearSearch.classList.add('d-none');

  // 4. Trigger local cache re-filtering instantly
  if (typeof handleFilterChange === 'function') {
    handleFilterChange();
  } else if (window.dashboardCache) {
    processAndFilterData(window.dashboardCache);
  }
}

  /**
   * Handle filtering instantaneously in client-side memory
   */
  function handleMonthChange() {
      if (window.dashboardCache) {
          processAndFilterData(window.dashboardCache);
      } else {
          loadDashboard();
      }
  }

  /**
   * Consolidated Change Handler triggered by any dropdown state updates
   */
  function handleFilterChange() {
      if (window.dashboardCache) {
          processAndFilterData(window.dashboardCache);
      }
  }

  /**
   * Clear the text search input and re-evaluate filters
   */

          searchEl.value = '';

  /**
 * Processes and filters cached or fresh dashboard data based on current UI selections
 */
function processAndFilterData(rawData) {
    if (!rawData) return;
    
    // 1. Deep clone isolation
    let dataCopy = JSON.parse(JSON.stringify(rawData));
    
    // 2. Read live UI filter states
    const monthFilterEl = document.getElementById('filterMonth');
    const targetMonth = monthFilterEl ? monthFilterEl.value : "All";
    
    const yearFilterEl = document.getElementById('filterYear');
    const currentYear = yearFilterEl ? yearFilterEl.value : new Date().getFullYear().toString();

    const sourceFilterEl = document.getElementById('filterSource');
    const targetSource = sourceFilterEl ? sourceFilterEl.value : "All";

    const floorFilterEl = document.getElementById('filterFloor');
    const targetFloor = floorFilterEl ? floorFilterEl.value : "All";

    // Read Search Input and manage clear button visibility
    const searchFilterEl = document.getElementById('filterSearchQuery');
    const rawSearchQuery = searchFilterEl ? searchFilterEl.value.trim().toLowerCase() : "";
    
    const clearBtn = document.getElementById('btnClearSearch');
    if (clearBtn) {
        if (rawSearchQuery.length > 0) {
            clearBtn.classList.remove('d-none');
        } else {
            clearBtn.classList.add('d-none');
        }
    }

    // Clean search string (strips non-numeric characters for phone searching)
    const cleanPhoneQuery = rawSearchQuery.replace(/\D/g, '');

    // 3. Extract baseline working guest list array
    let guestsRaw = dataCopy.guests || [];
    let workingArray = Array.isArray(guestsRaw) ? guestsRaw : Object.values(guestsRaw);
    
    // 4. FILTER MATRIX EVALUATION
    let filteredArray = workingArray.filter(g => {
        // --- Dimension A: Month Matching ---
        let matchMonth = true;
        if (targetMonth !== "All" && targetMonth !== "") {
            if (!g.Month) return false;
            const recordMonth = String(g.Month).trim().toLowerCase();
            const selectedMonth = targetMonth.toLowerCase();
            matchMonth = recordMonth.startsWith(selectedMonth) || selectedMonth.startsWith(recordMonth);
        }

        // --- Dimension B: Booking Source Matching ---
        const guestSource = g.Source ? g.Source.toString().trim().toLowerCase() : "";
        const matchSource = (targetSource === "All" || guestSource === targetSource.toLowerCase());

        // --- Dimension C: Property Floor Assignment Matching ---
        const guestFloor = g.Floor ? g.Floor.toString().trim().toLowerCase() : "";
        const selectedFloor = targetFloor.toLowerCase();
        let matchFloor = (targetFloor === "All" || targetFloor === "") 
          ? true 
          : (guestFloor.includes(selectedFloor) || selectedFloor.includes(guestFloor));

        // --- Dimension D: Search Query Matching (Name OR Mobile) ---
        let matchSearch = true;
        if (rawSearchQuery !== "") {
            const guestName = g.Name ? String(g.Name).toLowerCase() : "";
            
            // Check guest mobile (evaluate raw string and digits-only format)
            const guestPhoneRaw = (g.Phone || g.Mobile || g["Mobile No"] || "").toString();
            const guestPhoneDigits = guestPhoneRaw.replace(/\D/g, '');

            const nameMatches = guestName.includes(rawSearchQuery);
            const phoneMatches = guestPhoneRaw.toLowerCase().includes(rawSearchQuery) || 
                                (cleanPhoneQuery.length > 0 && guestPhoneDigits.includes(cleanPhoneQuery));

            matchSearch = nameMatches || phoneMatches;
        }

        return matchMonth && matchSource && matchFloor && matchSearch;
    });
    
    // 5. COMPUTE KPI METRICS
    let runningRevenue = 0;
    filteredArray.forEach(g => {
        let amtStr = g.Amount ? String(g.Amount).replace(/[₹,]/g, '') : "0";
        let amt = parseFloat(amtStr) || 0;
        runningRevenue += amt;
    });

    // 6. Build contextual UI title tracking label
    let periodLabel = (targetMonth === "All" || targetMonth === "") 
      ? `All Months ${currentYear}` 
      : `${targetMonth} ${currentYear}`;

    if (targetSource !== "All") periodLabel += ` (${targetSource})`;
    if (targetFloor !== "All") periodLabel += ` (${targetFloor})`;
    if (rawSearchQuery !== "") periodLabel += ` [Filtered by "${rawSearchQuery}"]`;

    // 7. Commit updated data back to payload copy safely
    dataCopy.guests = filteredArray;
    dataCopy.summary = dataCopy.summary || {};
    dataCopy.summary.totalRevenue = runningRevenue.toLocaleString('en-IN');
    dataCopy.summary.count = filteredArray.length;
    dataCopy.summary.period = `${periodLabel} Collection Summary`;

    // 8. Render dashboard view
    if (typeof renderDashboard === 'function') {
        renderDashboard(dataCopy);
    }
}
  
  /**
   * UI loading toggle helper function to animate icons smoothly
   */
  function toggleRefreshLoadingState(isLoading) {
    const icon = document.getElementById('refresh-icon');
    const spinner = document.getElementById('refresh-spinner');
    const btn = document.getElementById('refresh-dashboard-btn');
    const feedContainer = document.getElementById('guest-feed'); // Target the main layout card area
    
    if (!icon || !spinner || !btn) return;

    if (isLoading) {
        // 1. Convert the header button state to spinning
        icon.classList.add('d-none');
        spinner.classList.remove('d-none');
        btn.disabled = true;

        // 2. ENFORCED: Inject your exact primary center spinner back into the feed
        if (feedContainer) {
            feedContainer.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary opacity-25" role="status"></div>
                </div>
            `;
        }
    } else {
        // 3. Revert header button back to normal arrow icon
        icon.classList.remove('d-none');
        spinner.classList.add('d-none');
        btn.disabled = false;
        
        // Note: feedContainer.innerHTML is handled and replaced natively by renderDashboard(data)
    }
}

  document.addEventListener("DOMContentLoaded", function() {

/**
 * Initializes the dashboard lifecycle. Resolves available year tabs,
 * updates the filter options, and sets the dashboard to the current year.
 */
function initializeDashboardLifecycle() {
    console.log(">>> [BOOT] Querying live database tab names...");
    
    google.script.run
        .withSuccessHandler(function(config) {
            const yearDropdown = document.getElementById('filterYear');
            if (!yearDropdown) return;
            
            // Clear out any old elements safely
            yearDropdown.innerHTML = '';
            
            // Populate options dynamically from real Google Sheets structures
            config.years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.innerText = year;
                
                // Set active matching selection on initial render state
                if (year === config.activeYear) {
                    option.selected = true;
                }
                yearDropdown.appendChild(option);
            });
            
            console.log(`>>> [BOOT] Year filters armed: [${config.years.join(', ')}]. Active year defaults to: [${config.activeYear}].`);
            
            // Kickstart standard dashboard data fetch using the dynamically evaluated selected year state
            loadDashboard();
        })
        .withFailureHandler(function(err) {
            console.error(">>> [BOOT CRASH] System failed to inventory layout years: ", err.message);
            // Hard fallback if connectivity issues happen on configuration query
            const yearDropdown = document.getElementById('filterYear');
            if (yearDropdown) {
                yearDropdown.innerHTML = `<option value="${new Date().getFullYear()}">${new Date().getFullYear()}</option>`;
            }
            loadDashboard();
        })
        .getAvailableYearsAndInitialize();
}

// Redirect your page initialization anchor to target the new boot method
document.addEventListener("DOMContentLoaded", function() {
    if (typeof initTooltips === 'function') initTooltips();
    
    // Instead of calling loadDashboard() directly, hit the year configurations analyzer first!
    initializeDashboardLifecycle(); 
});

/**
 * Dynamically rebuilds the Month Dropdown chronologically (January -> December)
 * based exclusively on data rows present in the active sheet year.
 */
function rebuildMonthDropdown(guests) {
    const monthDropdown = document.getElementById('filterMonth');
    if (!monthDropdown) return;

    // 1. Save the user's active filter viewport selection before wiping elements
    const previousSelection = monthDropdown.value || "";

    // 2. Reset dropdown container with the constant baseline master switch
    monthDropdown.innerHTML = '<option value="">All Months</option>';

    if (!guests) return;

    // Normalize incoming data format structure down to a real collection loop wrapper
    const guestList = Array.isArray(guests) ? guests : Object.values(guests);

    // 3. Extract completely unique month names present in your ledger data
    const uniqueMonths = [];
    guestList.forEach(g => {
        if (g.Month && g.Month.trim() !== "") {
            // Capitalize first letter to guarantee matching consistency (e.g. "may" -> "May")
            const m = g.Month.trim().charAt(0).toUpperCase() + g.Month.trim().slice(1).toLowerCase();
            if (!uniqueMonths.includes(m)) {
                uniqueMonths.push(m);
            }
        }
    });

    // 4. FIXED CHRONOLOGICAL ORDER DICTIONARY: Maps full names to calendar metrics
    const calendarSequence = { 
        "January": 1, "February": 2, "March": 3, "April": 4, "May": 5, "June": 6, 
        "July": 7, "August": 8, "September": 9, "October": 10, "November": 11, "December": 12 
    };
    
    // Sort array entries mathematically from 1 up to 12
    uniqueMonths.sort((a, b) => (calendarSequence[a] || 99) - (calendarSequence[b] || 99));

    // 5. Generate and append the option tags dynamically into your view component
    uniqueMonths.forEach(monthName => {
        const option = document.createElement('option');
        option.value = monthName;      // Sets structural matching value to full word (e.g., "January")
        option.innerText = monthName;  // Sets readable interface presentation label
        
        // Retain the user's active focus if it matches an option in the new dataset
        if (monthName === previousSelection) {
            option.selected = true;
        }
        
        monthDropdown.appendChild(option);
    });

    // If their active filter doesn't exist in this specific historical year, reset the look cleanly to "All"
    if (previousSelection && !uniqueMonths.includes(previousSelection)) {
        monthDropdown.value = "";
    }
}

    return 'https://api.whatsapp.com/send?phone=' + cleanPhone + '&text=' + encodeURIComponent(msg);
}

/*Render dashobard data*/
function renderDashboard(data) {
    // 1. Log the entire raw response from the server
    console.log(">>> [DEBUG] Server Data Received:", data);

    // --- TURN OFF ALL SPINNERS AUTOMATICALLY ---
    toggleRefreshLoadingState(false);

    // 2. Initial Null Check with specific log
    if (!data) {
        console.error(">>> [ERROR] Data is null or undefined.");
        document.getElementById('guest-feed').innerHTML = 
            '<div class="alert alert-danger mx-3">Error: No response from server.</div>';
        return;
    }

    if (!data.summary) {
        console.error(">>> [ERROR] 'summary' property missing from data object. Data keys found:", Object.keys(data));
        document.getElementById('guest-feed').innerHTML = 
            '<div class="alert alert-danger mx-3">Error: Summary data missing.</div>';
        return;
    }

    // --- FORCE CONVERT TYPE TO GUARANTEE A CLEAN REVERSAL ---
    let normalizedGuests = [];
    
    if (Array.isArray(data.guests)) {
        normalizedGuests = data.guests.slice();
    } else if (typeof data.guests === 'object' && data.guests !== null) {
        normalizedGuests = Object.keys(data.guests)
                                 .sort((a, b) => Number(a) - Number(b))
                                 .map(key => data.guests[key]);
    }

    // =========================================================================
    // 🔑 CALCULATE TOTAL STAYED DAYS & CHECK-INS
    // =========================================================================
    const totalCheckins = data.summary.count !== undefined ? data.summary.count : normalizedGuests.length;
    
    // Sum up 'Days' for all guests in the retrieved dataset
    const totalStayDays = normalizedGuests.reduce((sum, guest) => {
        const nights = parseInt(guest.Days || '1', 10);
        return sum + (isNaN(nights) ? 0 : nights);
    }, 0);

    const currentPeriod = data.summary.period || 'Selected Period';

    // 3. Log Summary details
    console.log(">>> [DEBUG] Summary Details:", {
        revenue: data.summary.totalRevenue,
        count: totalCheckins,
        totalStayDays: totalStayDays,
        period: currentPeriod
    });

    // Update Summary UI
    document.getElementById('stat-revenue').innerText = data.summary.totalRevenue;
    document.getElementById('stat-count').innerText = data.summary.count;
    document.getElementById('period-label').innerText = data.summary.period;

    // Safely update total stay days on card metric if element exists
    const statDaysEl = document.getElementById('stat-days');
    if (statDaysEl) {
        // Formats as "(192 Days)" or "192 Days Total Stay" based on element context
        statDaysEl.innerText = statDaysEl.classList.contains('small') 
            ? `${totalStayDays} Days Total Stay` 
            : `(${totalStayDays} Days)`;
    }

    // --- COMPONENT UPDATE: Inject the new All-Time Revenue target element value ---
    const lifetimeRevEl = document.getElementById('stat-lifetime-revenue');
    const lifetimeCountEl = document.getElementById('stat-lifetime-count');

    if (lifetimeRevEl && data.summary.lifetimeRevenue) {
        lifetimeRevEl.innerText = '₹' + data.summary.lifetimeRevenue;
    }
    
    if (lifetimeCountEl && data.summary.lifetimeCount !== undefined) {
        lifetimeCountEl.innerText = data.summary.lifetimeCount.toLocaleString('en-IN');
    }

    feed.innerHTML = '';

    // 4. Log Guest List status
    if (normalizedGuests.length === 0) {
        console.warn(">>> [DEBUG] Guest list is empty.");
        feed.innerHTML = '<div class="text-center mt-5 text-muted">No entries found for this period.</div>';
        return;
    }
    
    console.log(`>>> [DEBUG] Processing ${normalizedGuests.length} guests.`);

     console.log("activeDashboardYear :", activeDashboardYear);

        })
        .syncAirbnbEmails(activeDashboardYear); // Calls the backend function

document.addEventListener("DOMContentLoaded", function() {

    tooltipTriggerList.map(function (tooltipTriggerEl) {

            boundary: document.body,

        });

// A comprehensive, bulletproof way to initialize Bootstrap tooltips
function initTooltips() {
  try {
    // 1. Verify Bootstrap's JavaScript library is safely loaded in the memory ecosystem
    if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
      const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
      
      tooltipTriggerList.map(function (tooltipTriggerEl) {
        // Clean up any old instances before rebuilding to prevent detached memory leaks
        const oldInstance = bootstrap.Tooltip.getInstance(tooltipTriggerEl);
        if (oldInstance) oldInstance.dispose();
        
        return new bootstrap.Tooltip(tooltipTriggerEl, {
          boundary: document.body,
          trigger: 'hover',
          fallbackPlacements: ['top', 'left'] // Automatically adjusts if screen space is tight on mobile
        });
      });
      console.log(">>> [UI] Bootstrap Tooltips successfully bound and armed.");
    } else {
      console.warn(">>> [UI] Bootstrap JS library missing. Retrying in 500ms...");
      setTimeout(initTooltips, 500); // Retry loop structure if script load tags are lagging
    }
  } catch (err) {
    console.error("Tooltip engine init failed: ", err);
  }
}

// Trigger initialization on both standard DOM ready statuses
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTooltips);
} else {
    initTooltips(); // Execute immediately if DOM elements are already structurally hot
}

let bootstrapFormModalInstance = null;

function getModalInstance() {

        return null;
    }
    
    // 1. Check if Bootstrap already bound an active instance to this DOM element
    let instance = bootstrap.Modal.getInstance(modalEl);

    if (!instance) {

 */
function toggleFinancialPanel() {
    const source = document.getElementById('inputSource').value;
    const financialBlock = document.getElementById('personalFinancialBlock');
    
    if (source === 'Personal') {
        financialBlock.style.display = 'block';
        calculateTotalBill();
    } else {

    }
}

function calculateTotalBill() {
    const sourceElement = document.getElementById('inputSource');
    const source = sourceElement ? sourceElement.value : 'Personal';
    
    const inputAmountEl = document.getElementById('inputAmount');
    const advancePaid = inputAmountEl ? (parseFloat(inputAmountEl.value) || 0) : 0;
    
    const totalBillEl = document.getElementById('inputTotalBill');
    const balanceDueEl = document.getElementById('inputBalanceDue');

    if (source !== 'Personal') {
        if (totalBillEl) totalBillEl.value = advancePaid.toFixed(0);
        if (balanceDueEl) balanceDueEl.value = "0";
        return;
    }

    // Fixed elements targeting to properly match the form IDs
    const guestsEl = document.getElementById('inputGuests');
    const daysEl = document.getElementById('inputDays');
    const basePriceEl = document.getElementById('inputBasePrice');
    const extraFeeEl = document.getElementById('inputExtraGuestFee');

    const totalGuests = guestsEl ? (parseInt(guestsEl.value, 10) || 1) : 1;
    const durationNights = daysEl ? (parseInt(daysEl.value, 10) || 1) : 1;
    const basePrice = basePriceEl ? (parseFloat(basePriceEl.value) || 0) : 0;
    const extraFee = extraFeeEl ? (parseFloat(extraFeeEl.value) || 0) : 0;
    
    const extraGuestsCount = Math.max(0, totalGuests - 1);
    const calculatedTotal = (basePrice + (extraGuestsCount * extraFee)) * durationNights;
    const balanceDue = calculatedTotal - advancePaid;

    if (totalBillEl) totalBillEl.value = calculatedTotal.toFixed(0);
    if (balanceDueEl) balanceDueEl.value = balanceDue.toFixed(0);
}

    fields.forEach(id => {
        const el = document.getElementById(id);

    });
});

    console.log(">>> 🔓 [MODAL OPEN] Triggered. Raw guest data received from card:", guestObj);

    // Reset inline error alerts if any exist from previous validation checks
    const alertBanner = document.getElementById('formAlertContainer');
    if (alertBanner) {
        alertBanner.style.display = 'none';
        alertBanner.innerHTML = '';
    }

    document.getElementById('guestCrudForm').reset();
    document.getElementById('formMode').value = "EDIT";
    
    // Bind unique structural references
    const calculatedRowIndex = guestObj.Row_Number || guestObj.rowNum || "";
    document.getElementById('formRowIndex').value = calculatedRowIndex;
    
    // 🔑 BIND UNIQUE RESERVATION ID
    const extractedResId = guestObj.ReservationID || guestObj.Reservation_ID || guestObj.reservationId || "";
    const resIdInputEl = document.getElementById('inputReservationId');
    if (resIdInputEl) {
        resIdInputEl.value = extractedResId;
    }
    console.log(`>>> 📍 [MODAL OPEN] Targeted Row: [${calculatedRowIndex}] | Reservation ID: [${extractedResId}]`);
    
    // Fill Text & Digital Elements
    document.getElementById('inputName').value = guestObj.Name || "";
    
    // Fill standard financial parameters mapping keys safely
    let fetchedAdvance = "0";
    if (guestObj.Advance !== undefined && guestObj.Advance !== null && guestObj.Advance !== "") {
        fetchedAdvance = guestObj.Advance;
    } else if (guestObj.Advance_Paid !== undefined && guestObj.Advance_Paid !== null && guestObj.Advance_Paid !== "") {
        fetchedAdvance = guestObj.Advance_Paid;
    } else if (guestObj.Amount !== undefined && guestObj.Amount !== null && guestObj.Amount !== "") {
        fetchedAdvance = guestObj.Amount; // Default to Total Amount if no advance record exists
    }
    
    document.getElementById('inputAmount').value = String(fetchedAdvance).replace(/[₹,]/g,'');
    document.getElementById('inputBasePrice').value = guestObj["Base_Price"] ? String(guestObj["Base_Price"]).replace(/[₹,]/g,'') : "1200";
    document.getElementById('inputExtraGuestFee').value = guestObj["Extra_Pax"] ? String(guestObj["Extra_Pax"]).replace(/[₹,]/g,'') : "400";

    document.getElementById('inputGuests').value = guestObj.Guests || "1";
    document.getElementById('inputDays').value = guestObj.Days || "1";
    document.getElementById('inputComments').value = guestObj.Comments || "";

    // Parse Mobile Number (Strip country code to match data protocols)
    let rawMobile = guestObj.WhatsApp_Num || guestObj.Mobile || "";
    let cleanMobile = rawMobile.toString().replace(/^\+91/, '').trim();
    document.getElementById('inputMobile').value = cleanMobile;

    // --- SAFE LOCAL ISO EXTRACTION SYSTEM ---
    if (guestObj.Check_in_Date) {
        let dateStr = String(guestObj.Check_in_Date).trim();
        let parsedDate = new Date(dateStr);
        
        if (!isNaN(parsedDate.getTime())) {
            let yyyy = parsedDate.getFullYear();
            let mm = String(parsedDate.getMonth() + 1).padStart(2, '0');
            let dd = String(parsedDate.getDate()).padStart(2, '0');
            
            let formattedIsoDate = `${yyyy}-${mm}-${dd}`;
            
            document.getElementById('inputCheckIn').value = formattedIsoDate;
            console.log(`>>> 📅 [MODAL OPEN] Date parsed cleanly: "${dateStr}" ➔ "${formattedIsoDate}"`);
        } else {
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                document.getElementById('inputCheckIn').value = dateStr;
            } else {
                document.getElementById('inputCheckIn').value = "";
                console.warn(`>>> ⚠️ [MODAL OPEN] Date fallback could not translate structural data: "${dateStr}"`);
            }
        }
    } else {
        console.warn(">>> ⚠️ [MODAL OPEN] " + guestObj.Name + "'s profile is missing a Check_in_Date property value.");
        document.getElementById('inputCheckIn').value = "";
    }

    // --- DROPDOWN SELECTORS MATCHING ---
    const rawSource = guestObj.Source ? guestObj.Source.toString().trim().toLowerCase() : "";
    const sourceSelectEl = document.getElementById('inputSource');
    if (rawSource.includes("airbnb")) {
        sourceSelectEl.value = "Airbnb";
    } else if (rawSource.includes("personal")) {
        sourceSelectEl.value = "Personal";
    } else {
        sourceSelectEl.value = "Airbnb"; 
    }

    const rawFloor = guestObj.Floor ? guestObj.Floor.toString().trim().toLowerCase() : "";
    const floorSelectEl = document.getElementById('inputFloor');
    if (rawFloor.includes("ground") || rawFloor === "g") {
        floorSelectEl.value = "Ground";
    } else if (rawFloor.includes("second") || rawFloor === "s") {
        floorSelectEl.value = "Second";
    } else {
        floorSelectEl.value = "Ground"; 
    }

    const rawRatings = guestObj.Customer_Ratings || "";
    document.getElementById('inputRatings').value = rawRatings;

    console.log(`>>> 🎛️ [MODAL OPEN] Dropdowns assigned configurations: Source=[${sourceSelectEl.value}], Floor=[${floorSelectEl.value}], Ratings=[${rawRatings || 'None'}]`);

    if (typeof toggleFinancialPanel === "function") toggleFinancialPanel();
    if (typeof calculateTotalBill === "function") calculateTotalBill();

    document.getElementById('guestFormModalLabel').innerText = "Modify Guest Registration";
    document.getElementById('formSubmitBtn').innerText = "Update Changes";
    getModalInstance().show();
}

/** Handle form data for addition and modify*/
function handleFormSubmit(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('formSubmitBtn');
    const alertBanner = document.getElementById('formAlertContainer');
    const nameInput = document.getElementById('inputName');
     
    if (alertBanner) {
        alertBanner.style.display = 'none';
        alertBanner.innerHTML = '';
    }
    
    const checkInInput = document.getElementById('inputCheckIn');
    if (!checkInInput || !checkInInput.value) {
        alert("Please select a valid Check-In Date before submitting.");
        return false;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Processing Booking...";

    const mode = document.getElementById('formMode').value;
    const rowIdx = document.getElementById('formRowIndex').value;
    
   
    const filterYearEl = document.getElementById('filterYear');
    const activeYear = filterYearEl ? filterYearEl.value : new Date().getFullYear().toString();

    const sourceVal = document.getElementById('inputSource').value;
    const advancePaidAmt = parseFloat(document.getElementById('inputAmount').value) || 0;
    
    const computedTotalBill = sourceVal === 'Personal' ? (parseFloat(document.getElementById('inputTotalBill').value) || 0) : advancePaidAmt;
    const computedBalanceDue = sourceVal === 'Personal' ? (parseFloat(document.getElementById('inputBalanceDue').value) || 0) : 0;

    // 🔑 EXTRACT RESERVATION ID WITH FALLBACK
    const resIdEl = document.getElementById('inputReservationId');
    let reservationIdVal = resIdEl ? resIdEl.value.trim() : "";

    // Emergency log check if empty during EDIT mode
    if (mode === "EDIT" && !reservationIdVal) {
        console.warn(">>> ⚠️ [FORM SUBMIT] Reservation ID input element missing or empty during EDIT mode!");
    }

    const payload = {
        mode: mode,
        reservationId: reservationIdVal, // 🔑 PASSED TO BACKEND FOR PRECISE MATCHING
        name: nameInput.value.trim(),
        mobile: document.getElementById('inputMobile').value.replace(/\s+/g, ''), 
        guests: parseInt(document.getElementById('inputGuests').value) || 1, 
        checkIn: checkInInput.value, 
        days: parseInt(document.getElementById('inputDays').value) || 1,
        source: sourceVal,
        floor: document.getElementById('inputFloor').value,
        ratings: document.getElementById('inputRatings').value,
        comments: document.getElementById('inputComments').value.trim(),
        year: activeYear,
        rowIndex: rowIdx,
        
        advancePaid: advancePaidAmt,
        totalBill: computedTotalBill,
        balanceDue: computedBalanceDue,

        basePrice: parseFloat(document.getElementById('inputBasePrice').value) || 0,
        extraPaxFee: parseFloat(document.getElementById('inputExtraGuestFee').value) || 0
    };

    console.log(`>>> 🚀 [CRUD DISPATCH] Mode: [${mode}] | Res ID: [${reservationIdVal}] | Year Target: [${activeYear}]`);
    
    google.script.run
        .withSuccessHandler(function(response) {
            console.log(`>>> ✅ [CRUD TRANSACTION SUCCESS] Backend Response: "${response}"`);
            submitBtn.disabled = false;
            submitBtn.innerText = (mode === "EDIT") ? "Update Booking" : "Save Booking";
            getModalInstance().hide();
            loadDashboard(true); 
        })
        .withFailureHandler(function(err) {
            console.error(">>> ❌ [CRUD TRANSACTION FAILURE] API pipeline execution failed:", err);
            
            submitBtn.disabled = false;
            submitBtn.innerText = (mode === "EDIT") ? "Update Booking" : "Save Booking";

            if (err.message && err.message.includes("Duplicate Entry Blocked")) {
                if (alertBanner) {
                    alertBanner.innerHTML = `<strong>⚠️ Reservation Conflict:</strong> This guest name is already registered for this date. Please check your duplicates.`;
                    alertBanner.style.display = 'block';
                    alertBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                
                if (nameInput) {
                    nameInput.focus();
                    nameInput.select();
                }
            } else {
                if (alertBanner) {
                    alertBanner.innerHTML = `<strong>❌ Database Error:</strong> ${err.message}`;
                    alertBanner.style.display = 'block';
                }
            }
        })
        .writeGuestDataRow(mode, payload);
}

/**
 * Checks if selected Floor & Check-In Date range collides with existing bookings in cache
 */
function checkDateAvailability() {
    const alertBox = document.getElementById('dateAvailabilityAlert');
    const checkInInput = document.getElementById('inputCheckIn');
    const floorInput = document.getElementById('inputFloor');
    const daysInput = document.getElementById('inputDays');
    const currentResId = document.getElementById('inputReservationId')?.value || "";

    if (!alertBox || !checkInInput || !floorInput) return;

    const selectedDateStr = checkInInput.value;
    const selectedFloor = floorInput.value ? floorInput.value.trim().toLowerCase() : "";
    const numNights = parseInt(daysInput?.value || "1", 10);

    // Reset if no date chosen
    if (!selectedDateStr || !selectedFloor) {
        alertBox.className = "mt-1 d-none";
        alertBox.innerHTML = "";
        return;
    }

    // 1. Calculate selected date range bounds
    const newStart = new Date(selectedDateStr);
    newStart.setHours(0, 0, 0, 0);

    const newEnd = new Date(newStart);
    newEnd.setDate(newEnd.getDate() + numNights);

    // 2. Query cached guest records
    if (!window.dashboardCache || !window.dashboardCache.guests) {
        alertBox.className = "mt-1 d-none";
        return;
    }

    const guests = Array.isArray(window.dashboardCache.guests) 
        ? window.dashboardCache.guests 
        : Object.values(window.dashboardCache.guests);

    // 3. Look for overlap on the same floor
    let conflictGuest = null;

    for (let g of guests) {
        // Skip current record when editing an existing guest
        const gResId = (g.ReservationID || g.reservationId || "").toString().trim();
        if (currentResId && gResId === currentResId.toString().trim()) {
            continue;
        }

        const gFloor = g.Floor ? g.Floor.toString().trim().toLowerCase() : "";
        if (!gFloor.includes(selectedFloor) && !selectedFloor.includes(gFloor)) {
            continue; // Different floor, no conflict
        }

        // Parse existing guest stay range
        if (!g.Check_in_Date) continue;
        const existStart = new Date(g.Check_in_Date);
        if (isNaN(existStart.getTime())) continue;
        existStart.setHours(0, 0, 0, 0);

        const existNights = parseInt(g.Days || g.Nights || "1", 10);
        const existEnd = new Date(existStart);
        existEnd.setDate(existEnd.getDate() + existNights);

        // Date Range Overlap Formula: (StartA < EndB) AND (EndA > StartB)
        if (newStart < existEnd && newEnd > existStart) {
            conflictGuest = g;
            break; // Conflict discovered
        }
    }

    // 4. Render UI status badge
    if (conflictGuest) {
        const guestName = conflictGuest.Name || "Another Guest";
        const sourceName = conflictGuest.Source || "Booked";
        
        alertBox.className = "mt-1 alert alert-warning py-1 px-2 mb-0 d-flex align-items-center gap-1 border-0 rounded-3 shadow-sm";
        alertBox.style.fontSize = "11px";
        alertBox.style.backgroundColor = "#fff3cd";
        alertBox.style.color = "#664d03";
        alertBox.innerHTML = `
            <i class="bi bi-exclamation-triangle-fill text-warning fs-6"></i>
            <span><strong>Already Booked:</strong> ${guestName} (${sourceName})</span>
        `;
    } else {
        alertBox.className = "mt-1 alert alert-success py-1 px-2 mb-0 d-flex align-items-center gap-1 border-0 rounded-3 shadow-sm";
        alertBox.style.fontSize = "11px";
        alertBox.style.backgroundColor = "#d1e7dd";
        alertBox.style.color = "#0f5132";
        alertBox.innerHTML = `
            <i class="bi bi-check-circle-fill text-success fs-6"></i>
            <span>Floor Available</span>
        `;
    }
}

    orphanedBackdrops.forEach(el => el.remove());
    document.body.classList.remove('modal-open');
    
    // 2. Display the structural modal workspace framework container instantly

    document.getElementById('qidUserFeed').innerHTML =

            '<span class="text-muted small">Accessing Firestore ID Vault...</span>' +
        '</div>';
        
    // 3. DYNAMIC LIFECYCLE FORK: Query dynamic year groupings from Firestore
    console.log(">>> [UI LIFE] Querying Firestore storage mapping allocations for dynamic years...");
    google.script.run
        .withSuccessHandler(function(config) {
            const yearDropdown = document.getElementById('qidFilterYear');
            if (yearDropdown) {
                // Clear existing dynamic elements but leave "All Years" intact
                yearDropdown.innerHTML = '<option value="">All Years</option>';
                
                // Inject option definitions dynamically from Firestore collection groupings
                config.years.forEach(year => {
                    const option = document.createElement('option');
                    option.value = year;
                    option.innerText = year;
                    
                    // Mark match default active flag on current calendar configuration rules
                    if (year === config.activeYear) {
                        option.selected = true;
                    }
                    yearDropdown.appendChild(option);
                });
                console.log(`>>> [UI COMPLETE] Dynamic Year Combobox populated from Firestore: [${config.years.join(', ')}].`);
            }
            
            // 4. Proceed to fetch main guest list records once years are ready
            fetchMasterQidDataMatrix();
            updateStorageMetricsUI();
        })
        .withFailureHandler(function(err) {
            console.error(">>> [UI LIFECYCLE FAULT] Firestore years inventory failed: ", err.message);
            // Fallback strategy: Populate current calendar year as safety baseline
            const yearDropdown = document.getElementById('qidFilterYear');
            if (yearDropdown && yearDropdown.options.length <= 1) {
                const fallbackYear = new Date().getFullYear().toString();
                const option = document.createElement('option');
                option.value = fallbackYear;
                option.innerText = fallbackYear;
                option.selected = true;
                yearDropdown.appendChild(option);
            }
            fetchMasterQidDataMatrix();
        })
        .getFirestoreRegistryConfig(); // Renamed to reflect Firestore migration
}

/**
 * Calculates and updates the Storage Bar UI
 */
function updateStorageMetricsUI() {
    const totalLimitGB = 5.0; 
    
    // This would ideally be a google.script.run call to get actual bytes
    // For now, we estimate based on number of records (e.g., each record with 3 images is ~2MB)
    const recordCount = globalQidDataStore.length;
    const estimatedUsageMB = (recordCount * 1.8); // 1.8MB per profile average
    const usageGB = (estimatedUsageMB / 1024).toFixed(2);
    const percent = Math.min(((usageGB / totalLimitGB) * 100), 100);

    const bar = document.getElementById('storage-progress-bar');
    const label = document.getElementById('storage-usage-text');

    if (bar && label) {
        bar.style.width = percent + '%';
        label.innerText = `${usageGB} GB / ${totalLimitGB} GB`;

        // Dynamic color shifting
        bar.className = 'progress-bar progress-bar-striped progress-bar-animated ';
        if (percent > 85) {
            bar.classList.add('bg-danger');
        } else if (percent > 60) {
            bar.classList.add('bg-warning');
        } else {
            bar.classList.add('bg-success');
        }
    }
}

/**
 * FEATURE 1 ENGINE: Memory-retaining, search-resilient viewport reduction pipeline
 */
function filterQidRecords() {
    console.log(">>> [FILTER PIPELINE] Re-evaluating dynamic search criteria fields...");
    
    const query = document.getElementById('qidSearchInput').value.toLowerCase().trim();
    
    // Direct checks to accommodate optional elements safely
    const yearEl = document.getElementById('qidFilterYear');
    const monthEl = document.getElementById('qidFilterMonth');
    const targetYear = yearEl ? yearEl.value : "";
    const targetMonth = monthEl ? monthEl.value : "";
    
    const filteredRecords = globalQidDataStore.filter((row) => {
        // 1. Text Search Input Field Matching
        const matchesText = !query || 
                            (row.name || "").toLowerCase().includes(query) || 
                            (row.phone || "").includes(query) || 
                            (row.arrivingCity || "").toLowerCase().includes(query);
                            
        // 2. Timeline Metadata Array Evaluation
        if (!row.timestamp) {
            return matchesText && !targetYear && !targetMonth;
        }
        
        const dateObj = new Date(row.timestamp);
        const rowYear = dateObj.getFullYear().toString();
        const rowMonth = dateObj.toLocaleString('en-US', { month: 'long' });
        
        const matchesYear = !targetYear || rowYear === targetYear;
        const matchesMonth = !targetMonth || rowMonth === targetMonth;
        
        return matchesText && matchesYear && matchesMonth;
    });
    
    console.log(`>>> [FILTER PIPELINE] View matches isolated: [${filteredRecords.length}] records found.`);
    
    // Dispatch calculations down to card UI engine
    renderQidFeed(filteredRecords);
    
    // Keep header synchronization controls aligned with viewport state mutations
    syncMasterCheckboxState();
}

                            <i class="bi bi-geo-alt text-danger me-1"></i><strong>Address:</strong> <span class="text-dark">${user.address || '-'}</span>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 pt-2 mt-2 border-top justify-content-start ps-4">
                    ${frontUrlHtml}
                    ${backUrlHtml}
                    ${selfieUrlHtml}
                </div>
            </div>
        </div>`;
    });
    
    feed.innerHTML = html;
    evaluateQidSelectionState();
}

/**
 * Handle state data alterations for single card checkbox interaction elements
 */
function handleSingleCheckboxChange(node) {
    const targetId = String(node.getAttribute('data-id'));
    if (node.checked) {
        if (!activeSelectedIds.includes(targetId)) {
            activeSelectedIds.push(targetId);
        }
    } else {
        activeSelectedIds = activeSelectedIds.filter(id => id !== targetId);
    }
    evaluateQidSelectionState();
    syncMasterCheckboxState();
}

/**
 * FEATURE 2 ENGINE: Toggles selection states ONLY for elements currently visible in view matrix
 */
function toggleAllQidCheckboxes(masterNode) {
    const isChecked = masterNode.checked;
    console.log(`>>> [SELECTION SYSTEM] Master toggle state changed to: [${isChecked}]`);
    
    // Find matching elements within active card wrapper nodes
    const visibleCheckboxes = document.querySelectorAll('.qid-user-card .qid-row-checkbox');
    
    visibleCheckboxes.forEach(cb => {
        cb.checked = isChecked;
        const targetId = String(cb.getAttribute('data-id'));
        
        if (isChecked) {
            if (!activeSelectedIds.includes(targetId)) activeSelectedIds.push(targetId);
        } else {
            activeSelectedIds = activeSelectedIds.filter(id => id !== targetId);
        }
    });
    
    evaluateQidSelectionState();
}

/**
 * FEATURE 2 ENGINE: Evaluates current checked counts and handles floating action bar shifts
 */
function evaluateQidSelectionState() {
    const panel = document.getElementById('qidBatchActionPanel');
    const countText = document.getElementById('qidSelectedCountText');
    const totalCount = activeSelectedIds.length;
    
    if (totalCount > 0) {
        if (countText) {
            countText.innerText = `${totalCount} profile${totalCount > 1 ? 's' : ''} selected for deletion`;
        }
        if (panel && panel.classList.contains('d-none')) {
            panel.classList.remove('d-none');
        }
    } else {
        if (panel && !panel.classList.contains('d-none')) {
            panel.classList.add('d-none');
        }
        
        const master = document.getElementById('qidMasterCheckbox');
        if (master && master.checked) {
            master.checked = false;
        }
    }
}

/**
 * Synchronizes the state of the top master checkbox control using viewport parameters
 */
function syncMasterCheckboxState() {
    const master = document.getElementById('qidMasterCheckbox');
    if (!master) return;
    
    const visibleCheckboxes = document.querySelectorAll('.qid-user-card .qid-row-checkbox');
    if (visibleCheckboxes.length === 0) {
        master.checked = false;
        return;
    }
    
    const allVisibleChecked = Array.from(visibleCheckboxes).every(cb => cb.checked);
    master.checked = allVisibleChecked;
}

/**
 * FEATURE 2 ENGINE: Resets all checkboxes and safely retracts structural overlays
 */
function clearQidSelections() {
    // Instead of just clearing IDs, we exit the special mode entirely
    exitQidSelectionMode();
    evaluateQidSelectionState();
}

/**
 * Helper Utility to trigger highly customized professional confirmation/status alerts
 */
function showQidActionPrompt(options) {
    const modalEl = document.getElementById('qidActionModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    
    // Inject Title & Subtext Details Safely
    document.getElementById('qidActionTitle').innerText = options.title || "Confirm Action";
    document.getElementById('qidActionMessage').innerText = options.message || "";
    
    // Set Theme Configurations (Danger/Warning/Success)
    const iconContainer = document.getElementById('qidActionIconContainer');
    const iconEl = document.getElementById('qidActionIcon');
    const confirmBtn = document.getElementById('btnQidActionConfirm');
    
    // Clear old theme definitions
    iconContainer.className = "mb-3 d-flex align-items-center justify-content-center mx-auto rounded-circle";
    confirmBtn.className = "btn btn-sm text-white px-3 w-50";
    
    if (options.type === "danger") {
        iconContainer.classList.add("bg-danger-subtle");
        iconEl.className = "bi bi-exclamation-triangle text-danger fs-3";
        confirmBtn.classList.add("bg-danger");
    } else {
        iconContainer.classList.add("bg-warning-subtle");
        iconEl.className = "bi bi-question-circle text-warning fs-3";
        confirmBtn.classList.add("bg-warning", "text-dark");
    }
    
    // Set confirmation button action text labels
    confirmBtn.innerText = options.confirmText || "Confirm";
    
    // Handle Event Execution Mapping Safely without memory leak piling
    confirmBtn.onclick = function() {
        modal.hide();
        if (typeof options.onConfirm === "function") options.onConfirm();
    };
    
    modal.show();
}

/**
 * Modernized Modifier Module: Opens the editing modal and auto-populates old data values
 */
function actionModifyQidUser(id) {
    // Locate target profile within the local Firestore-backed cache
    const targetRecord = globalQidDataStore.find(function(u) { return String(u.id) === String(id); });
    if (!targetRecord) {
        alert("Unable to cross-reference file verification data.");
        return;
    }
    
    // Inject values securely into form elements
    document.getElementById('editQidId').value = targetRecord.id;
    document.getElementById('editQidName').value = targetRecord.name || "";
    document.getElementById('editQidDocNo').value = targetRecord.idNo || "";
    document.getElementById('editQidAddress').value = targetRecord.address || "";
    document.getElementById('editQidEmergencyName').value = targetRecord.emergencyName || "";
    
    // Sanitize phone input formats automatically to match strict data protocols (+91 prefix removal)
    let cleanPhoneDisplay = (targetRecord.phone || "").toString().replace(/^\+91/, "").replace(/\s+/g, "");
    document.getElementById('editQidPhone').value = cleanPhoneDisplay;

    let cleanEmergPhoneDisplay = (targetRecord.emergencyPhone || "").toString().replace(/^\+91/, "").replace(/\s+/g, "");
    document.getElementById('editQidEmergencyPhone').value = cleanEmergPhoneDisplay;
    
    // Fire up the modal overlay element frame cleanly
    const editModalEl = document.getElementById('qidEditUserModal');
    bootstrap.Modal.getOrCreateInstance(editModalEl).show();
}

/**
 * Serializes, sanitizes, and sends profile updates to the spreadsheet ledger
 */
function submitQidProfileEdits() {
    const docId = document.getElementById('editQidId').value;
    const rawName = document.getElementById('editQidName').value;
    const rawPhone = document.getElementById('editQidPhone').value;
    const rawDocNo = document.getElementById('editQidDocNo').value;
    const rawAddress = document.getElementById('editQidAddress').value;
    const rawEmergName = document.getElementById('editQidEmergencyName').value;
    const rawEmergPhone = document.getElementById('editQidEmergencyPhone').value;
    
    // --- SYSTEM CORRECTION PRESETS: Strict normalization enforcement ---
    // Instantly strip trailing spaces, +91 prefixes, and inner dashes
    const sanitizedName = rawName.trim();
    const sanitizedDocNo = rawDocNo.trim();
    const sanitizedAddress = rawAddress.trim();
    const sanitizedEmergName = rawEmergName.trim();
    const sanitizedPhone = rawPhone.toString().replace(/^\+91/, "").replace(/[-\s()]+/g, "").trim();
    const sanitizedEmergPhone = rawEmergPhone.toString().replace(/^\+91/, "").replace(/[-\s()]+/g, "").trim();
    
    const saveButton = document.getElementById('btnQidEditSave');
    saveButton.disabled = true;
    saveButton.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status"></span> Saving...`;
    
    // Fire network call upstream to modify Firestore document
    google.script.run
        .withSuccessHandler(function(response) {
            saveButton.disabled = false;
            saveButton.innerText = "Save Changes";
            
            const editModalEl = document.getElementById('qidEditUserModal');
            bootstrap.Modal.getOrCreateInstance(editModalEl).hide();
            
            console.log(">>> [UPDATE FIRESTORE PROFILE COMPLETED]", response);
            openQidHubModal(); 
        })
        .withFailureHandler(function(err) {
            saveButton.disabled = false;
            saveButton.innerText = "Save Changes";
            
            showQidActionPrompt({
                type: "danger",
                title: "Modification Aborted",
                message: "Firestore synchronization failed: " + err.message,
                confirmText: "Close"
            });
        })
        .updateFirestoreGuestRecord(docId, { 
            name: sanitizedName, 
            phone: sanitizedPhone,
            idNo: sanitizedDocNo,
            address: sanitizedAddress,
            emergencyName: sanitizedEmergName,
            emergencyPhone: sanitizedEmergPhone
        });
}

/**
 * Intercept Firebase Storage URLs and pipe them directly into an in-app lightbox frame
 */
function launchSecureQidPreview(rawUrl) {
    if (!rawUrl || rawUrl.trim() === "" || rawUrl.indexOf("-") === 0) {
        alert("No valid media proof link attached to this validation profile.");
        return;
    }
    
    const previewModalEl = document.getElementById('qidPreviewModal');
    const imageFrame = document.getElementById('qidPreviewImageFrame');
    const spinner = document.getElementById('qidPreviewImageSpinner');
    const modalInstance = bootstrap.Modal.getOrCreateInstance(previewModalEl);
    
    imageFrame.style.opacity = "0.0";
    spinner.classList.remove('d-none');
    modalInstance.show();
    
    google.script.run
        .withSuccessHandler(function(base64DataStream) {
            spinner.classList.add('d-none');
            
            if (!base64DataStream || base64DataStream === "ERROR") {
                alert("Firebase Storage access blocked. Please verify security rules.");
                return;
            }
            
            imageFrame.src = base64DataStream;
            imageFrame.style.opacity = "1";
        })
        .withFailureHandler(function(err) {
            spinner.classList.add('d-none');
            imageFrame.style.opacity = "1";
            alert("System Transmission Failure: " + err.message);
        })
        .getFirebaseStorageImage(rawUrl);
}

/**
 * EXECUTION ENGINE: Upgraded to prevent animation/backdrop race conditions and handle multi-selections smoothly
 */
function triggerBatchDeleteQid() {
    if (activeSelectedIds.length === 0) return;
    
    console.log(`>>> [DELETION PIPELINE] Initialized Firestore batch delete for:`, activeSelectedIds);
    
    const hubModalEl = document.getElementById('qidHubModal');
    const actionModalEl = document.getElementById('qidActionModal');
    
    const iconContainer = document.getElementById('qidActionIconContainer');
    const icon = document.getElementById('qidActionIcon');
    const title = document.getElementById('qidActionTitle');
    const message = document.getElementById('qidActionMessage');
    const confirmBtn = document.getElementById('btnQidActionConfirm');
    
    // Clean up event listeners on the confirmation button
    const freshConfirmBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(freshConfirmBtn, confirmBtn);
    
    // --- SETUP CONFIRMATION MODAL CONTENT DIRECTLY ---
    title.innerText = "Confirm Batch Deletion";
    message.innerHTML = `Are you sure you want to permanently delete all <strong>${activeSelectedIds.length} selected profiles</strong>?<br><span class="text-danger fw-medium">This will remove their data from Firestore and purge all associated images from Firebase Storage.</span>`;

    if (iconContainer) iconContainer.className = "mb-3 d-flex align-items-center justify-content-center mx-auto rounded-circle bg-danger-subtle text-danger";
    if (icon) icon.className = "bi bi-exclamation-triangle-fill fs-3";
    
    freshConfirmBtn.className = "btn btn-sm btn-danger text-white px-3 w-50";
    freshConfirmBtn.innerText = "Delete Records";
    
    // Handle the deletion processing loop
    freshConfirmBtn.addEventListener('click', function() {
        const totalItems = activeSelectedIds.length;
        console.log(`>>> [DELETION PIPELINE] Batch execution confirmed for ${totalItems} items.`);
        
        // 1. Hide confirmation wrapper pop-up modal
        let bsActionModal = bootstrap.Modal.getInstance(actionModalEl);
        if (bsActionModal) bsActionModal.hide();
        
        // 2. Inject the inline spinner directly into the main QID Registry feed
        const userFeedContainer = document.getElementById('qidUserFeed');
        if (userFeedContainer) {
            userFeedContainer.innerHTML = `
                <div class="col-12 text-center py-5 animate__animated animate__fadeIn">
                    <div class="spinner-border text-danger" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
                    <div class="mt-3 text-secondary fw-medium small">
                        Permanently purging ${totalItems} guest profile(s) from Firestore...
                    </div>
                    <div class="text-muted mt-1" style="font-size: 11px;">
                        Updating cloud collections, please do not close this window.
                    </div>
                </div>
            `;
        }
        
        // Hide floating bottom action snackbar panel
        const batchPanel = document.getElementById('qidBatchActionPanel');
        if (batchPanel) batchPanel.style.display = 'none';
        
        // 3. Call Apps Script backend execution pipeline
        google.script.run
          .withSuccessHandler(function(response) {
             console.log(">>> [SERVER API SUCCESS] Batch delete sweep finalized.");
             
             // Reset selections
             clearQidSelections();
             activeSelectedIds = [];
             
             const masterCheckbox = document.getElementById('qidMasterCheckbox');
             if (masterCheckbox) masterCheckbox.checked = false;
             
             // Reload data grid seamlessly without flickering the parent modal
             if (typeof fetchMasterQidDataMatrix === "function") {
                 fetchMasterQidDataMatrix();
             } else if (typeof refreshAllDashboardsAndRegistries === "function") {
                 refreshAllDashboardsAndRegistries();
             } else {
                 openQidHubModal();
             }
          })
          .withFailureHandler(function(err) {
             console.error(">>> [SERVER API FAILURE] Batch delete sweep failed:", err);
             if (userFeedContainer) {
                 userFeedContainer.innerHTML = `
                     <div class="col-12 alert alert-danger border-0 shadow-sm mx-2 mt-3">
                         <i class="bi bi-exclamation-triangle-fill me-2"></i>
                         <strong>Deletion Error:</strong> The system failed to purge some assets. 
                         <div class="small mt-1 text-dark">${err.message}</div>
                     </div>
                 `;
             }
           })
          .deleteFirestoreGuestsBatch(activeSelectedIds);
    });

    // --- EXECUTION STEP ---
    // Do NOT hide hubModalEl anymore! Show actionModalEl stacked on top of it.
    let modalInstance = bootstrap.Modal.getInstance(actionModalEl) || new bootstrap.Modal(actionModalEl);
    modalInstance.show();
}

function triggerFloorAvailabilityCheck() {
  const fromDate = document.getElementById('check-from-date').value;
  const toDate = document.getElementById('check-to-date').value;
  const statusContainer = document.getElementById('floor-status-container');
  const btnText = document.getElementById('avail-btn-text');
  const spinner = document.getElementById('avail-spinner');

  if (!fromDate || !toDate) {
    statusContainer.innerHTML = '<span class="text-warning small" style="font-size: 11px;"><i class="bi bi-exclamation-triangle me-1"></i>Select dates</span>';
    return;
  }

  spinner.classList.remove('d-none');
  btnText.innerText = "Checking...";
  statusContainer.innerHTML = ''; 

  google.script.run
    .withSuccessHandler(function(statusMap) {
      spinner.classList.add('d-none');
      btnText.innerText = "Check Now";

      // Dynamic theme injector based on computed smart status variants
      const getBadge = (floorName, floorData) => {
        let badgeClass = "";
        let icon = "";
        
        if (floorData.status === "AVAILABLE") {
          badgeClass = "bg-success-subtle text-success border border-success-subtle";
          icon = "🌱";
        } else if (floorData.status === "PARTIAL") {
          badgeClass = "bg-warning-subtle text-warning-emphasis border border-warning-subtle";
          icon = "⏳";
        } else {
          badgeClass = "bg-danger-subtle text-danger border border-danger-subtle";
          icon = "🔒";
        }

        return `<span class="badge ${badgeClass} rounded-pill me-1" style="font-size: 11px; padding: 4px 10px;">${icon} ${floorName}: ${floorData.text}</span>`;
      };

      statusContainer.innerHTML = 
        getBadge('Ground Floor', statusMap.ground) + 
        getBadge('Second Floor', statusMap.second);
    })
    .withFailureHandler(function(err) {
      spinner.classList.add('d-none');
      btnText.innerText = "Check Now";
      statusContainer.innerHTML = '<span class="text-danger small" style="font-size: 11px;"><i class="bi bi-exclamation-octagon me-1"></i>Error</span>';
      console.error(err);
    })
    .checkFloorWiseAvailability(fromDate, toDate);
}
