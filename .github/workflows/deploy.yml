name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Create Authentication File
        run: |
          if [ -z "${{ secrets.CLASPRC_JSON }}" ]; then
            echo "Error: CLASPRC_JSON secret is empty or not set in GitHub Secrets."
            exit 1
          fi
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Update Existing Deployment
        run: clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} --description "Automated update from GitHub Actions"